name = "snip-ai-backend"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Biến môi trường KHÔNG bí mật (public). Secret thật (GEMINI_API_KEYS,
# GOOGLE_CLIENT_SECRET, APP_SESSION_SECRET, APP_SHARED_SECRET) đặt bằng lệnh
# `wrangler secret put <tên>` — KHÔNG bao giờ ghi trực tiếp vào file này (file
# này commit lên git).
[vars]
GEMINI_MODEL = "gemini-3.6-flash"
# Model RIÊNG cho lượt hỏi có bật "Tra cứu web" (Google Search grounding) —
# đã xác nhận qua trang giá chính thức: grounding KHÔNG khả dụng ở Free Tier
# cho dòng Gemini 3.x (GEMINI_MODEL ở trên), nhưng Gemini 2.5 Flash có free
# tier riêng cho grounding (500 lượt/ngày). Có default cứng trong code
# (index.ts) nên dòng này chỉ để dễ đổi mà không cần sửa code.
GEMINI_SEARCH_MODEL = "gemini-2.5-flash"
# Model đọc câu trả lời thành giọng nói (POST /v1/gemini/tts). Bản "lite"
# nhanh + rẻ hơn, đủ tốt để đọc câu trả lời; có free tier.
GEMINI_TTS_MODEL = "gemini-3.8-flash-lite-tts"
# OAuth Client ID (loại "Desktop app", tạo ở Google Cloud Console > Google
# Auth Platform > Clients) — KHÔNG bí mật, được nhúng thẳng vào app desktop
# để mở URL đăng nhập Google, an toàn để commit lên git.
GOOGLE_CLIENT_ID = "172316423385-jn5bi3gq5trh5jvloiaba0jep2vnipra.apps.googleusercontent.com"

# Lưu câu trả lời khảo sát mức độ hài lòng (POST /v1/survey) — mỗi lượt gửi 1
# key riêng (timestamp+random), không cần đọc lại có cấu trúc phức tạp nên KV
# đơn giản là đủ, không cần D1. Xem index.ts.
[[kv_namespaces]]
binding = "SURVEY_KV"
id = "908b71a1c2dc410d8f326337f838c26c"

# Ép Cloudflare chạy Worker CHÍNH (auth/oauth/survey — mọi thứ TRỪ lệnh gọi
# Gemini, xem Durable Object bên dưới) ở colo gần backend hơn — chỉ là tối ưu
# độ trễ nhẹ, KHÔNG còn là lớp phòng chặn-vùng chính (xem giải thích tại sao
# bên dưới). Miễn phí ở mọi gói Workers, nhưng cần ~15 phút + đủ traffic để
# Cloudflare "học" được nên không có tác dụng ngay lập tức sau khi deploy.
[placement]
mode = "smart"

# Durable Object GHIM CỨNG vị trí chạy cho lệnh gọi Gemini — xem giải thích
# đầy đủ ở backend/src/geminiProxy.ts. Đây mới là lớp phòng CHÍNH cho lỗi
# "User location is not supported for the API use" (Gemini API chặn theo vị
# trí của BÊN GỌI — Cloudflare, không phải máy người dùng): Smart Placement ở
# trên chỉ là BEST-EFFORT (cần thời gian/traffic để "học", không đảm bảo),
# còn `locationHint` ở đây là CAM KẾT CỨNG của Cloudflare, luôn ghim đúng 1
# vùng ("wnam" — Tây Bắc Mỹ, gần cụm server Gemini nhất) ngay từ lần đầu tạo.
[[durable_objects.bindings]]
name = "GEMINI_PROXY"
class_name = "GeminiProxy"

# BẮT BUỘC khai báo khi lần đầu thêm 1 class Durable Object mới — Cloudflare
# cần biết đây là class MỚI (không phải đổi tên/xoá 1 class cũ đã tồn tại).
# `new_sqlite_classes` (không phải `new_classes`) — gói Workers FREE (đang
# dùng) chỉ cho tạo Durable Object namespace kiểu SQLite-backed (lỗi thực tế
# đã gặp lúc deploy: "In order to use Durable Objects with a free plan, you
# must create a namespace using a `new_sqlite_classes` migration"). Object
# này không dùng storage gì cả (chỉ để ghim vị trí, xem geminiProxy.ts) nên
# không ảnh hưởng gì — chọn loại nào cũng hoạt động y hệt với nhu cầu ở đây.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["GeminiProxy"]
