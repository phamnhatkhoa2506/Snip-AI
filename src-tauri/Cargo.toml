[package]
name = "snip-ai-tauri"
version = "1.2.1"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "snip_ai_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
# Tự khởi động cùng Windows + system tray -> app chạy nền thực sự, không mất
# tích khi đóng cửa sổ Settings (trước đó chỉ ẩn được, không có cách mở lại).
tauri-plugin-autostart = "2"
# Chỉ cho phép 1 instance chạy cùng lúc (giống Snipping Tool) — nếu không có
# cái này, chạy lại .exe trong khi app đã chạy nền sẽ tạo process thứ 2, và
# process đó đăng ký global hotkey Ctrl+PrintScreen thất bại (hotkey chỉ 1
# process giữ được) -> setup() lỗi -> app thứ 2 tự thoát ngay (đúng bug đã gặp
# thực tế: cửa sổ hiện lên "load mãi rồi tắt luôn"). Có plugin này, chạy lại
# exe sẽ tự động focus lại cửa sổ của instance đang chạy thay vì tạo mới.
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Lưu API key vào Windows Credential Manager (OS keychain) thay vì localStorage.
# Key KHÔNG bao giờ được gửi ngược về frontend sau khi lưu — mọi lệnh gọi AI
# đọc key trực tiếp trong Rust, nên JS trong webview không thể đọc trộm key.
keyring = { version = "3", features = ["windows-native"] }
# Chụp màn hình đa nền tảng (Windows/macOS/Linux)
xcap = "0.0.14"
image = "0.25"
base64 = "0.22"
# Gọi AI trực tiếp từ Rust (không qua @tauri-apps/plugin-http nữa) — ảnh đã có
# sẵn trong AppState, không cần base64-hoá rồi gửi qua lại IPC (từng là nguyên
# nhân treo request trong dev mode do payload lớn qua kênh postMessage).
# native-tls (dùng Schannel của Windows) thay vì rustls — nghi ngờ 1 số mạng/
# proxy công ty hoặc phần mềm bảo mật xử lý khác nhau giữa 2 loại TLS stack,
# có thể khiến request bị route sai (đã gặp lỗi HTTP 404 generic khó hiểu).
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "native-tls"] }
futures-util = "0.3"
bytes = "1"
tokio = { version = "1", features = ["time"] }
# Đăng nhập Google (OAuth PKCE) — sha2 để tính code_challenge (SHA-256 của
# code_verifier), rand để sinh code_verifier/state ngẫu nhiên đủ mạnh, url để
# parse an toàn query string ("code"/"state") từ request callback loopback
# (thay vì tự tay tách chuỗi, dễ sai với ký tự đã percent-encode).
sha2 = "0.10"
rand = "0.8"
url = "2"
# Quay video màn hình (tính năng "Quay + hỏi AI", tận dụng việc Gemini hỗ trợ
# input video) — dùng Windows Graphics Capture API thuần, KHÔNG phụ thuộc
# ffmpeg (không phải đóng gói thêm binary ~50-100MB vào bộ cài). Crate này tự
# lo cả việc capture LẪN encode ra MP4 (H264, tăng tốc phần cứng qua Media
# Foundation) — chỉ cần gọi, không phải tự viết pipeline COM/MFT thủ công.
windows-capture = "2"


# Ép crate `image` LUÔN build tối ưu (opt-level=3) dù đang ở profile "dev"
# (không tối ưu) — việc resize ảnh (Lanczos3) test thấy khựng rõ khi chạy
# `npm run tauri dev` (build debug, không tối ưu hoá cho các phép toán trên
# từng pixel), nhưng mượt trong bản release. Cách này chỉ tối ưu được crate
# PHỤ THUỘC (`image`) — KHÔNG áp dụng được cho code của chính app (`record.rs`
# nằm trong crate gốc `snip-ai-tauri`, Cargo không cho override opt-level
# riêng cho crate gốc qua `[profile.dev.package.<tên>]`).
[profile.dev.package.image]
opt-level = 3

# opt-level=1 cho TOÀN BỘ code app ở chế độ dev — cần thiết vì vòng lặp cắt
# từng khung hình video (record.rs, copy hàng chục lần/giây) chạy ở
# opt-level=0 (mặc định debug) chậm tới mức bị coi là "treo": khung hình dồn ứ
# không kịp xử lý, callback không bao giờ bắt kịp mốc 30s hay cờ dừng, giống
# hệt bug đã gặp với resize ảnh Lanczos3 ở trên — nhưng lần này KHÔNG né được
# bằng cách override 1 crate phụ thuộc vì code nằm ngay trong crate gốc.
# opt-level=1 (thay vì 3) để vẫn giữ thời gian compile tăng dần (incremental)
# không chậm đi quá nhiều so với opt-level=0.
[profile.dev]
opt-level = 1

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
